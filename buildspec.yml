version: 0.2

# Integración continua en AWS CodeBuild: ejecuta las pruebas y, solo si pasan,
# genera el paquete de despliegue (.zip). No despliega nada.

phases:
  install:
    runtime-versions:
      python: 3.11
  pre_build:
    commands:
      - pip install -r requirements-dev.txt
  build:
    commands:
      # La versión se guarda en un archivo para el nombre del artefacto: el
      # nombre se evalúa al final, fuera del directorio del código.
      - grep -oE '[0-9]+\.[0-9]+\.[0-9]+' blacklist/version.py > /tmp/app_version
      # Falla el build si una prueba falla o la cobertura baja de 100 % (setup.cfg).
      - pytest -v
  post_build:
    commands:
      # CodeBuild siempre intenta subir el artefacto, incluso si BUILD falla.
      # Por eso el paquete solo se arma en dist/ cuando las pruebas pasaron;
      # si fallaron, dist/ no existe y no se sobrescribe el artefacto anterior.
      - |
        if [ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ]; then
          mkdir -p dist
          cp -r Dockerfile .dockerignore application.py requirements.txt .ebextensions blacklist dist/
          find dist -name __pycache__ -type d -prune -exec rm -rf {} +
          echo "Pruebas aprobadas. Versión $(cat /tmp/app_version)"
        fi

# Contenido igual al zip de Beanstalk: sin docker-compose.yml, .env ni tests/.
artifacts:
  base-directory: dist
  files:
    - Dockerfile
    - .dockerignore
    - application.py
    - requirements.txt
    - .ebextensions/**/*
    - blacklist/**/*
  name: blacklist-service-$(cat /tmp/app_version)
